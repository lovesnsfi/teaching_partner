[package]
name = "teaching_partner"
version = "0.2.6"
description = "局域网沟通与屏幕广播软件（Tauri + Vue3）"
authors = ["teaching_partner"]
edition = "2021"

[lib]
name = "teaching_partner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
if-addrs = "0.12"
rusqlite = { version = "0.31", features = ["bundled"] }
base64 = "0.22"
xcap = "0.9.8"
tauri-plugin-clipboard-manager = "2.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
